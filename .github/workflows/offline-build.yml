name: Offline Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Untrusted pull requests must never execute on this privileged build
    # machine. The maintainer provisions MSVC and the admitted encoder bundle.
    # See tools/encoder_build/README.md for the portable offline build recipe.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.302'
      - name: Verify pre-admitted encoder and corresponding-source materials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:FLOWER_ENCODER_EXE) { throw 'Provision FLOWER_ENCODER_EXE with the adjacent LICENSE, NOTICE.txt and corresponding-source ZIP pinned by ENCODER.json. This workflow does not fetch encoder inputs or materials.' }
          python -c "import os; from pathlib import Path; from tools.offline_release import verified_encoder_materials; policy, materials = verified_encoder_materials(Path.cwd(), Path(os.environ['FLOWER_ENCODER_EXE'])); print('Verified encoder materials: ' + policy['version'] + '; ' + ', '.join(sorted(materials)))"
          if ($LASTEXITCODE -ne 0) { throw 'Encoder binary, notices, source package or recipe binding failed.' }
      - name: Restore locked build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Venv creation failed.' }
          .\.venv\Scripts\python.exe -m pip install --only-binary=:all: --require-hashes -r requirements.lock -r requirements-web.lock
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency acquisition failed.' }
          foreach ($project in @('flower_control/drivers/high_helper/Flower.HighHelper.csproj','flower_control/drivers/app_native/Flower.AppWorker.csproj','flower_control/drivers/computer_wgc/Flower.ComputerWgc.csproj')) {
            dotnet restore $project -r win-x64 --locked-mode -p:SelfContained=true -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) { throw ('Locked restore failed: ' + $project) }
          }
          foreach ($project in @('tools/codex_signer_probe/Probe.csproj','tools/installer/FlowerControl.Setup.csproj')) {
            dotnet restore $project -r win-x64 --locked-mode -p:SelfContained=true -p:NuGetAudit=false
            if ($LASTEXITCODE -ne 0) { throw ('Runtime restore failed: ' + $project) }
          }
      - name: Build the complete offline candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP ('flower-offline-' + [guid]::NewGuid().ToString('N'))
          .\.venv\Scripts\python.exe tools/offline_release.py --site "$PWD/.venv/Lib/site-packages" --media-encoder $env:FLOWER_ENCODER_EXE --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Offline candidate build failed.' }
          "FLOWER_OFFLINE_OUTPUT=$output" >> $env:GITHUB_ENV
      - name: Verify without developer paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:FLOWER_OFFLINE_OUTPUT 'Payload'
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(DOTNET|COR_|COREHOST)' } | ForEach-Object { [Environment]::SetEnvironmentVariable($_.Name, $null, 'Process') }
          $env:DOTNET_DISABLE_GUI_ERRORS = '1'
          & (Join-Path $payload 'Python/python.exe') -B (Join-Path $payload 'Source/tools/offline_install.py') verify --payload $payload
          if ($LASTEXITCODE -ne 0) { throw 'Offline inventory check failed.' }
          & (Join-Path $payload 'Binaries/native/Flower.HighHelper.exe') --flower-capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained native startup failed.' }
          $setupCheck = Start-Process -FilePath (Join-Path $env:FLOWER_OFFLINE_OUTPUT 'Setup/FlowerControl-Setup.exe') -ArgumentList '--selftest' -Wait -PassThru
          if ($setupCheck.ExitCode -ne 0) { throw 'Installer selftest failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FlowerControl-unsigned-review-candidate
          path: |
            ${{ env.FLOWER_OFFLINE_OUTPUT }}/FlowerControl-offline-win-x64.zip
            ${{ env.FLOWER_OFFLINE_OUTPUT }}/Setup/FlowerControl-Setup.exe
            ${{ env.FLOWER_OFFLINE_OUTPUT }}/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
    # This workflow does not publish a Release. The encoder guard verifies
    # fixed materials; it is not blanket legal or installed-product acceptance.
    # Matching clean-Windows, host/control and lifecycle acceptance remain explicit.
